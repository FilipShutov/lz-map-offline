name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      maxzoom:
        description: "Max map zoom bundled offline (13 = streets, 14 = more detail, bigger APK)"
        default: "13"
  schedule:
    - cron: "17 3 * * 1"   # every Monday: rebuild with fresh repeater data

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Copy browser libraries
        run: node scripts/vendor.mjs

      - name: Download repeater data, coverage images and Bulgaria map
        env:
          GH_TOKEN: ${{ github.token }}
          MAXZOOM: ${{ github.event.inputs.maxzoom || '13' }}
        run: bash scripts/fetch-offline-data.sh

      - name: Create Android project
        run: |
          npx cap add android
          # GPS permissions for "nearest repeaters"
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../lz-repeaters.apk
          ls -lh ../lz-repeaters.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lz-repeaters-apk
          path: lz-repeaters.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest lz-repeaters.apk \
            --title "LZ Репитери (офлайн) – $(date -u +%Y-%m-%d)" \
            --notes "Download **lz-repeaters.apk** on your Android phone and open it to install. Built $(date -u +'%Y-%m-%d %H:%M') UTC with $(jq length www/data/repeaters.json) repeaters."
